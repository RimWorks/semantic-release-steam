version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      # fix cuts a patch release, which is what ships an updated runtime dependency
      prefix: "fix(deps)"
      # chore is absent from releaseRules, so a dev-only bump does not cut a release
      prefix-development: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
