name: sonar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    uses: RimWorks/mod-ci/.github/workflows/sonar-scan.yml@v3
    with:
      project-key: RimWorks_semantic-release-steam
      exclusions: tests/fixtures/**,coverage/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
