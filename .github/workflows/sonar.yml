name: sonar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    uses: RimWorks/mod-ci/.github/workflows/sonar-scan.yml@f516504a51b1c916489710c2c95f6bbb41e8f7f1 # v1.10.0
    with:
      project-key: RimWorks_semantic-release-steam
      exclusions: tests/fixtures/**,coverage/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
