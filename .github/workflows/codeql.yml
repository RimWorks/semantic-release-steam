name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 6 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    uses: RimWorks/mod-ci/.github/workflows/codeql.yml@v1
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["javascript-typescript", "actions"]'
