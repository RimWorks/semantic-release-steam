name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 6 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    uses: RimWorks/mod-ci/.github/workflows/codeql.yml@f516504a51b1c916489710c2c95f6bbb41e8f7f1 # v1.10.0
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["javascript-typescript", "actions"]'
